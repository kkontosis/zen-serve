[package]
name = "zen-core"
version = "0.1.0"
description = "zen-serve client-side crypto core: formats, key hierarchy, AEAD, keyslots, signatures"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Deterministic RNG and the test-vector generator. Never enable in production builds.
test-utils = ["dep:serde_json", "dep:zen-proto"]
# OPAQUE (spec/auth.md §8): the cipher suite and the client side of sign-in
# method 3. Off by default: it adds an older RustCrypto generation
# (curve25519-dalek 4, sha2 0.10) to the build.
opaque = ["dep:opaque-ke", "dep:sha2", "dep:rand_core"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = { version = "1.8", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
x-wing = { version = "0.1", features = ["zeroize", "hazmat"] }
zeroize = { version = "1.8", features = ["derive"] }
serde_json = { version = "1", optional = true }
# Only for the ACL vectors (test-utils).
zen-proto = { path = "../zen-proto", optional = true }
# OPAQUE, RFC 9807: pure Rust, no_std, builds for wasm32. 4.x keeps the
# RFC's message and record formats; the stored records (ServerRegistration,
# ServerSetup) must stay readable, so take only 4.x releases.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"], optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
zen-proto = { path = "../zen-proto" }
zen-core = { path = ".", features = ["test-utils", "opaque"] }

[[example]]
name = "gen_vectors"
required-features = ["test-utils"]
