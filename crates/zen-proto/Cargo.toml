[package]
name = "zen-proto"
version = "0.1.0"
description = "zen-serve wire types (spec/api.md): CBOR request/response bodies, stream frames, the signed ACL document"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
# TypeScript declarations of the wire types, for the WASM bindings
# (crates/zen-wasm). Byte fields are `Uint8Array`, `ByteBuf` is an alias of it.
ts = ["dep:tsify", "dep:wasm-bindgen"]
