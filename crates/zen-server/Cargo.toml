[package]
name = "zen-server"
version = "0.1.0"
description = "zen-serve: the keyless E2EE storage server (KV, commit, event log, consumer groups, static files)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zen-serve"
path = "src/main.rs"

[features]
# FoundationDB backend and supervisor commands (needs libfdb_c).
fdb = ["zen-store/fdb"]
# A software WebAuthn authenticator (`webauthn::soft`), for tests.
test-utils = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
blake3 = "1.8"
ciborium = "0.2"
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["pkcs8"] }
serde_json = "1"
getrandom = "0.4"
include_dir = "0.7"
mime_guess = "2"
# WebAuthn RS256 (spec/auth.md §7), pure Rust. A release candidate: the
# rsa release for this RustCrypto generation (signature 3, sha2 0.11,
# crypto-bigint 0.7) is not out yet. Pinned exactly, so that a newer RC
# can't change behaviour unnoticed; only public-key verification is used.
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["sha2"] }
# WebAuthn (spec/auth.md §7): ES256 verification, pure Rust.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8"] }
# Native TLS and client certificates (spec/auth.md §10): rustls with a
# crypto provider of our own on RustCrypto (`tls::provider`), pure Rust.
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hmac = "0.13"
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
toml = "1"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `opaque`: the OPAQUE cipher suite of sign-in method 3 (spec/auth.md §8).
zen-core = { path = "../zen-core", features = ["opaque"] }
zen-proto = { path = "../zen-proto" }
zen-store = { path = "../zen-store" }

[target.'cfg(unix)'.dependencies]
# SIGTERM for the supervised FoundationDB processes (a safe `kill` wrapper).
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tempfile = "3"
tokio-tungstenite = "0.30"
zen-core = { path = "../zen-core", features = ["test-utils", "opaque"] }
zen-server = { path = ".", features = ["test-utils"] }
