[package]
name = "zen-server"
version = "0.1.0"
description = "zen-serve: the keyless E2EE storage server (KV, commit, event log, consumer groups, static files)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zen-serve"
path = "src/main.rs"

[features]
# FoundationDB backend and supervisor commands (needs libfdb_c).
fdb = ["zen-store/fdb"]
# A software WebAuthn authenticator (`webauthn::soft`), for tests.
test-utils = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
blake3 = "1.8"
ciborium = "0.2"
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
ed25519-dalek = { version = "3.0", default-features = false }
serde_json = "1"
getrandom = "0.4"
include_dir = "0.7"
mime_guess = "2"
# WebAuthn (spec/auth.md §7): ES256 verification, pure Rust.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
toml = "1"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zen-core = { path = "../zen-core" }
zen-proto = { path = "../zen-proto" }
zen-store = { path = "../zen-store" }

[target.'cfg(unix)'.dependencies]
# SIGTERM for the supervised FoundationDB processes (a safe `kill` wrapper).
nix = { version = "0.30", default-features = false, features = ["signal"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
tempfile = "3"
tokio-tungstenite = "0.30"
zen-core = { path = "../zen-core", features = ["test-utils"] }
zen-server = { path = ".", features = ["test-utils"] }
