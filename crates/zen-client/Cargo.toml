[package]
name = "zen-client"
version = "0.1.0"
description = "zen-serve native client: device sign-in, the ACL walk, fs headers and keyslots, KV transactions with fences, named leases, device checkpoints and pins"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zen-client"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
# HTTP over rustls with our pure-Rust provider (zen-tls-rustcrypto), no C.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zen-core = { path = "../zen-core" }
zen-proto = { path = "../zen-proto" }
zen-tls-rustcrypto = { path = "../zen-tls-rustcrypto" }

[dev-dependencies]
tempfile = "3"
zen-core = { path = "../zen-core", features = ["test-utils"] }
# The server in-process, with the test adversary. No default features: the
# tests build with the features of the command line (pure Rust with
# `--no-default-features`).
zen-server = { path = "../zen-server", default-features = false, features = ["test-utils"] }
zen-tls-rustcrypto = { path = "../zen-tls-rustcrypto", features = ["test-utils"] }
