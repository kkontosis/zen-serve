[package]
name = "zen-svc"
version = "0.1.0"
description = "zen-serve: protocol engines for relayed services (svc.md §7): sans-IO, serializable at record boundaries, native and wasm32"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# `ssh::client`: a minimal SSH client on the engine's own parts, for tests.
test-utils = []

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
base64 = "0.22"
# The 64-bit-nonce ChaCha20 of chacha20-poly1305@openssh.com.
chacha20 = { version = "0.10", default-features = false, features = ["legacy"] }
ciborium = "0.2"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }
poly1305 = "0.9"
# User keys (rsa-sha2-256/512), verification only, under zen-tls-rustcrypto's
# key policy; pinned as there.
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
zen-tls-rustcrypto = { path = "../zen-tls-rustcrypto", features = ["tls12"] }
zeroize = "1.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
zen-svc = { path = ".", features = ["test-utils"] }
zen-tls-rustcrypto = { path = "../zen-tls-rustcrypto", features = ["tls12", "test-utils"] }
