name: CI

on:
  push:
  pull_request:
  # Started by hand: the openssh-pq job (TD-SVC-SSH-PQ-CI).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The SSH engine's tests run against OpenSSH (crates/zen-svc/tests).
      - name: OpenSSH client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-client
      - name: Test
        run: cargo test --all
      - name: wasm32 check
        run: |
          cargo check -p zen-core -p zen-proto --target wasm32-unknown-unknown
          cargo check -p zen-core --features opaque --target wasm32-unknown-unknown
          cargo check -p zen-tls-rustcrypto --target wasm32-unknown-unknown
          cargo check -p zen-svc -p zen-svc-wasm --target wasm32-unknown-unknown

  # The pure-Rust build: no ring, the TLS provider on RustCrypto
  # (spec/operations.md §8). The jobs around it test the default build,
  # with ring.
  pure-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: OpenSSH client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-client
      - name: Test (no default features)
        run: cargo test --all --no-default-features
      # With blake3's portable code too, nothing calls a C compiler.
      - name: Build without a C compiler
        env:
          CC: "false"
          CXX: "false"
        run: cargo check -p zen-server --no-default-features --features pure

  # The SSH engine against OpenSSH built from source (10.6p1): the hybrid
  # key exchange mlkem768x25519-sha256, which the runners' OpenSSH (9.6)
  # doesn't have, and the rest of the OpenSSH tests on a newer release.
  # Only when the workflow is started by hand (TD-SVC-SSH-PQ-CI).
  # zen-ublk as a real block device: FUSE, loop devices, ext4 and ublk,
  # as root (crates/zen-ublk/tests/devices.rs).
  devices:
    runs-on: ubuntu-latest
    # A hung device fails in minutes, not after GitHub's 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: FUSE, e2fsprogs, the ublk driver
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fuse3 e2fsprogs
          sudo modprobe ublk_drv || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe ublk_drv; }
          ls -l /dev/ublk-control /dev/fuse
      - name: Clippy
        run: cargo clippy -p zen-ublk --all-targets --features device-tests,ublk -- -D warnings
      - name: Test (as root)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          ZEN_TEST_REQUIRE_UBLK: "1"
        run: cargo test -p zen-ublk --features device-tests,ublk

  openssh-pq:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/openssh
          key: openssh-${{ runner.os }}-${{ hashFiles('scripts/build-openssh.sh') }}
      - name: Build OpenSSH
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf libssl-dev zlib1g-dev
          scripts/build-openssh.sh "$HOME/openssh"
      - name: Test against it
        run: |
          export ZEN_TEST_SSH="$HOME/openssh/ssh"
          cargo test -p zen-svc --test openssh --test openssh_pq -- --include-ignored

  # The FoundationDB backend, the supervisor and every server test against
  # a real cluster that zen-serve itself starts.
  fdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FoundationDB (pinned)
        run: sudo scripts/install-fdb.sh /opt/foundationdb
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Start a cluster with zen-serve init
        run: |
          cargo build -p zen-server --features fdb
          mkdir -p /tmp/zen-ci
          printf 'data_dir = "/tmp/zen-ci/data"\n[fdb]\nport = 4500\nauto_redundancy = false\n' > /tmp/zen-ci/node.toml
          nohup ./target/debug/zen-serve init --no-api -c /tmp/zen-ci/node.toml > /tmp/zen-ci/init.log 2>&1 &
          for i in $(seq 90); do
            ./target/debug/zen-serve status -c /tmp/zen-ci/node.toml && break
            sleep 2
          done
      - name: Test (fdb)
        env:
          ZEN_TEST_CLUSTER_FILE: /tmp/zen-ci/data/fdb.cluster
          ZEN_TEST_BACKEND: fdb
        run: cargo test -p zen-store -p zen-server --features fdb
      - name: Supervisor log
        if: failure()
        run: cat /tmp/zen-ci/init.log

  # @zen/client, zen-mount and @zen/db (docs/MILESTONE-4.md, MILESTONE-5.md):
  # the WASM core, then the TypeScript packages tested against a spawned
  # embedded zen-serve, in Node and in Chromium, and FUSE mounts.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen-cli at the Cargo.lock version
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: FUSE (zen-mount), OpenSSH client (ssh() tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fuse3 libfuse-dev pkg-config openssh-client
          sudo chmod 666 /dev/fuse
      - name: Build zen-serve, zen-client and the WASM module
        run: |
          cargo build -p zen-server --features test-utils -p zen-client
          scripts/build-wasm.sh
      - name: Install and build the packages
        run: |
          npm ci
          npm run build -w @zen/client -w @zen/fs
          npm run build:apps
      - name: Lint and typecheck
        run: |
          npx biome check
          npx tsc -p packages/client/tsconfig.test.json
          npx tsc -p packages/fuse/tsconfig.json --noEmit
          npx tsc -p packages/db/tsconfig.test.json
          npx tsc -p packages/fs/tsconfig.test.json
          npx tsc -p packages/loro/tsconfig.test.json
          npx tsc -p packages/svc/tsconfig.test.json
          npx tsc -p apps/tsconfig.json
      - name: Test (Node)
        run: npx vitest run
      - name: Test (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
