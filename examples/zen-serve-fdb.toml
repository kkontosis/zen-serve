# zen-serve on a FoundationDB cluster it supervises (spec/operations.md).
#
#   node 1:  zen-serve init -c zen-serve-fdb.toml      (prints a join token)
#   node n:  zen-serve join <token> -c zen-serve-fdb.toml
#   later:   zen-serve serve -c zen-serve-fdb.toml
#
# Build with: cargo build -p zen-server --release --features fdb

# The API (clients, browsers). Separate from the database addresses in [fdb]
# (spec/operations.md §3.3).
listen = "0.0.0.0:8080"
data_dir = "/var/lib/zen"
public_origins = ["https://zen.example.org"]

[[fs]]
id = 1

[storage]
backend = "fdb"
# cluster_file = "/etc/foundationdb/fdb.cluster"   # default: data_dir/fdb.cluster
# key_prefix = "clone-2026-10-03/"                 # serve a restored clone

[fdb]
processes = 2              # fdbserver processes on this node
listen_ip = "10.8.0.1"     # FoundationDB only: this node's WireGuard/private address.
                           # 127.0.0.1 for a single node; never 0.0.0.0 or public without TLS.
port = 4500
auto_redundancy = true     # single → double at 3 nodes → triple at 5
# tls_cert = "/etc/zen/fdb.pem"
# tls_key = "/etc/zen/fdb.key"
# tls_ca = "/etc/zen/ca.pem"

[backup]
agents = true              # run backup_agent for `zen-serve backup`

[limits]
ephemeral_ttl_secs = 60
ephemeral_bytes_per_sec = 65536   # a message costs its data + 256 bytes; 0 = no limit
ephemeral_burst_bytes = 1048576
