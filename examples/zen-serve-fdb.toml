# zen-serve on a FoundationDB cluster it supervises (spec/operations.md).
#
#   node 1:  zen-serve init -c zen-serve-fdb.toml      (prints a join token)
#   node n:  zen-serve join <token> -c zen-serve-fdb.toml
#   later:   zen-serve serve -c zen-serve-fdb.toml
#
# Build with: cargo build -p zen-server --release --features fdb

# The API (clients, browsers). Separate from the database addresses in [fdb]
# (spec/operations.md §3.3).
listen = "0.0.0.0:8080"
data_dir = "/var/lib/zen"
public_origins = ["https://zen.example.org"]

# TLS for the API, on this node (spec/operations.md §8); [fdb] tls_* below
# is the database's own TLS, unrelated. Without [tls]: plain HTTP behind a
# TLS reverse proxy.
# [tls]
# cert = "/etc/zen/api.pem"
# key = "/etc/zen/api.key"

[[fs]]
id = 1

[storage]
backend = "fdb"
# cluster_file = "/etc/foundationdb/fdb.cluster"   # default: data_dir/fdb.cluster
# key_prefix = "clone-2026-10-03/"                 # serve a restored clone

[fdb]
processes = 2              # fdbserver processes on this node
listen_ip = "10.8.0.1"     # FoundationDB only: this node's WireGuard/private address.
                           # 127.0.0.1 for a single node; never 0.0.0.0 or public without TLS.
port = 4500
auto_redundancy = true     # single → double at 3 nodes → triple at 5
# tls_cert = "/etc/zen/fdb.pem"
# tls_key = "/etc/zen/fdb.key"
# tls_ca = "/etc/zen/ca.pem"

[backup]
agents = true              # run backup_agent for `zen-serve backup`

[limits]
ephemeral_ttl_secs = 60
ephemeral_bytes_per_sec = 65536   # a message costs its data + 256 bytes; 0 = no limit
ephemeral_burst_bytes = 1048576

# Relayed services (spec/svc.md): zen-serve relays TCP connections to
# handlers on member clients, blind. Every node needs the same table; only
# `listen` may differ. Open the port to the internet: the peers connect there.
# [[service]]
# name = "ssh"
# fs = 1
## The service id: a topic id in hex, conventionally the topic "svc/<name>".
## Handlers need topic `consume` on it; tcp-auth connectors `append`.
# id = "00112233445566778899aabbccddeeff"
# mode = "tcp"                  # or "tcp-auth" (no listen: over /v1/svc/connect)
# listen = "0.0.0.0:2222"
# max_conns = 1024              # per node
# per_ip_rate = 10              # accepts per second per address; 0 = no limit
# per_ip_burst = 50
# window = 1048576              # unacked input bytes per connection (≥ 65536)
# out_window = 1048576          # unwritten output bytes per connection (≥ 65536)
# accept_wait_ms = 10000        # closed if no handler claims it by then
# handshake_secs = 30
# idle_secs = 300               # 0 = never
# resume = true                 # handlers can take over live connections
#
## A tcp-auth service has no port of its own: members connect through
## zen-serve's listener (/v1/svc/connect, with a zen token and topic
## `append` on the id), for example with zen-connect as an ssh ProxyCommand.
## per_ip_rate counts the WebSocket clients' addresses (behind a reverse
## proxy, its address: set 0 there).
# [[service]]
# name = "git"
# fs = 1
# id = "8899aabbccddeeff0011223344556677"
# mode = "tcp-auth"
# window = 1048576              # SSH services: 10 channel windows and 64 KiB
